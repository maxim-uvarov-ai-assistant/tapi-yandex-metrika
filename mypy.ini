[mypy]
# NOTE: Минимальная версия Python для запуска пакета - 3.6 (см. setup.py)
# Однако mypy 1.18+ поддерживает только python_version >= 3.9 для проверки типов.
# Type hints в коде используют синтаксис, совместимый с Python 3.6+
#
# РЕКОМЕНДАЦИЯ: Для production желательно использовать Python 3.9+, так как:
# - Python 3.6-3.8 больше не получают обновления безопасности (EOL)
# - Современные инструменты разработки требуют Python 3.9+
python_version = 3.9
warn_return_any = False
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
strict_optional = True
warn_no_return = True

# Allow some flexibility for the tapi-wrapper dependency
[mypy-tapi2.*]
ignore_missing_imports = True

# orjson should have types but may not be available
[mypy-orjson]
ignore_missing_imports = True

# requests types available via types-requests
[mypy-requests.*]
ignore_missing_imports = False
